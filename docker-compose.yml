services:
  baoge-music:
    build: .
    container_name: baoge-music
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./bot:/app/bot
    env_file:
      - .env
    environment:
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1
      - LAVALINK_ENABLED=false
      - LAVALINK_URI=http://lavalink:2333
      - LAVALINK_PASSWORD=youshallnotpass

  # Optional Lavalink audio node (Default disabled to save 1-2GB RAM).
  # Uncomment the block below and set LAVALINK_ENABLED=true if an external audio node is needed.
