services:
  baoge-music:
    build: .
    container_name: baoge-music
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./bot:/app/bot
    env_file:
      - .env
    environment:
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1
      - LAVALINK_ENABLED=${LAVALINK_ENABLED:-true}
      - LAVALINK_URI=${LAVALINK_URI:-http://lavalink:2333}
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - AUDIO_BRIDGE_PUBLIC_URL=${AUDIO_BRIDGE_PUBLIC_URL:-http://baoge-music:8765}
    depends_on:
      - lavalink

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2
    container_name: baoge-lavalink
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - _JAVA_OPTIONS=-Xms256m -Xmx1024m
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./data/lavalink/logs:/opt/Lavalink/logs
    ports:
      - "2333:2333"